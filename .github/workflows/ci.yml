name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit -p .

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders only; nothing connects during `next build`
          POSTGRES_PRISMA_URL: postgresql://ci:ci@localhost:5432/ci
          POSTGRES_URL_NON_POOLING: postgresql://ci:ci@localhost:5432/ci
          NEXT_TELEMETRY_DISABLED: 1
